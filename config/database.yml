# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  <% if ENV["DATABASE_URL"].present? %>
  adapter: postgresql
  encoding: unicode
  url: <%= ENV["DATABASE_URL"] %>
  <% else %>
  adapter: sqlite3
  database: storage/development.sqlite3
  <% end %>

test:
  <<: *default
  <% if ENV["DATABASE_URL"].present? %>
  adapter: postgresql
  encoding: unicode
  url: <%= ENV["DATABASE_URL"] %>
  <% else %>
  adapter: sqlite3
  database: storage/test.sqlite3
  <% end %>

production:
  primary:
    <<: *default
    <% if ENV["DATABASE_URL"].present? %>
    adapter: postgresql
    encoding: unicode
    url: <%= ENV["DATABASE_URL"] %>
    <% else %>
    adapter: sqlite3
    database: storage/production.sqlite3
    <% end %>
  cache:
    <<: *default
    <% if ENV["DATABASE_URL"].present? %>
    adapter: postgresql
    encoding: unicode
    url: <%= ENV["DATABASE_URL"] %>
    <% else %>
    adapter: sqlite3
    database: storage/production_cache.sqlite3
    <% end %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    <% if ENV["DATABASE_URL"].present? %>
    adapter: postgresql
    encoding: unicode
    url: <%= ENV["DATABASE_URL"] %>
    <% else %>
    adapter: sqlite3
    database: storage/production_queue.sqlite3
    <% end %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    <% if ENV["DATABASE_URL"].present? %>
    adapter: postgresql
    encoding: unicode
    url: <%= ENV["DATABASE_URL"] %>
    <% else %>
    adapter: sqlite3
    database: storage/production_cable.sqlite3
    <% end %>
    migrations_paths: db/cable_migrate

# ==============================================================================
# PostgreSQL Primary + Read Replica Multi-DB Configuration (Example)
# ==============================================================================
# When switching to PostgreSQL:
# 1. Add `gem "pg"` to Gemfile
# 2. Configure primary (writer) and replica (reader) with replica: true
#
# production:
#   primary:
#     adapter: postgresql
#     encoding: unicode
#     url: <%= ENV['DATABASE_URL'] %> # e.g. postgres://pg-primary:5432/user_service
#     pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
#   primary_replica:
#     adapter: postgresql
#     encoding: unicode
#     url: <%= ENV['DATABASE_REPLICA_URL'] %> # e.g. postgres://pg-replica:5432/user_service
#     replica: true
#     pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
